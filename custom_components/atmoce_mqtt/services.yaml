set_battery_control:
  target:
    entity:
      integration: atmoce_mqtt
      domain: select
  fields:
    mode:
      required: true
      selector:
        select:
          options:
            - charge
            - discharge
            - automatic
            - pause
    power:
      selector:
        number:
          min: 0.01
          max: 1000
          step: 0.01
          unit_of_measurement: kW
          mode: box
    target_soc:
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: box
